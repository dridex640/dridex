<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRIDEXCHAT</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#050505;
  --panel:#0b0b0f;
  --soft:#1a1a24;
  --red:#ff1f1f;
  --red2:#ff4d4d;
  --text:#fff;
  --muted:#aaa;
}

body{
  margin:0;
  height:100vh;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

#matrix{
  position:fixed;
  top:0;
  left:0;
  z-index:-1;
}

.box{
  width:430px;
  max-width:92vw;
  background:rgba(5,5,8,.94);
  border:1px solid var(--red);
  box-shadow:0 0 40px rgba(255,31,31,.75);
  padding:30px;
  border-radius:20px;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

h2,h3{
  text-align:center;
  text-shadow:0 0 12px var(--red);
}

input,button,select{
  width:100%;
  padding:13px;
  margin-top:12px;
  border-radius:12px;
  border:1px solid var(--red);
  background:#050505;
  color:#fff;
  font-size:15px;
  outline:none;
}

button{
  background:linear-gradient(135deg,#ff1f1f,#9b0000);
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#000;
  color:var(--red2);
  box-shadow:0 0 15px var(--red);
window.addEventListener("load", () => {

  buildRooms();
  buildEmojiPanel();
  buildGifPanel();
  renderFilms();

});
}

#error{
  color:#ff5555;
  text-align:center;
}

#chatBox{
  display:none;
  width:min(1160px,97vw);
  height:min(720px,95vh);
  background:rgba(0,0,0,.94);
  border:1px solid var(--red);
  box-shadow:0 0 45px rgba(255,31,31,.7);
  border-radius:20px;
  overflow:hidden;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

.sidebar{
  width:270px;
  height:100%;
  float:left;
  padding:14px;
  border-right:1px solid rgba(255,31,31,.8);
  background:linear-gradient(180deg,rgba(30,0,0,.98),rgba(8,8,14,.98));
  overflow-y:auto;
}

.brand{
  font-size:22px;
  font-weight:900;
  letter-spacing:2px;
  text-align:center;
  margin-bottom:16px;
  text-shadow:0 0 15px var(--red);
}

.section-title{
  font-size:12px;
  color:#bbb;
  text-transform:uppercase;
  letter-spacing:1.5px;
  margin:14px 0 8px;
}

.room,.user{
  padding:10px 12px;
  margin:7px 0;
  border:1px solid rgba(255,31,31,.45);
  border-radius:12px;
  background:rgba(255,31,31,.09);
  color:#fff;
  cursor:pointer;
}

.room:hover,.room.active{
  background:rgba(255,31,31,.25);
  box-shadow:0 0 14px rgba(255,31,31,.35);
  transform:translateX(3px);
}

.user{
  cursor:default;
  border-color:rgba(255,255,255,.12);
  background:rgba(255,255,255,.06);
}

.online-dot{
  color:#33ff77;
}

.main{
  margin-left:270px;
  height:100%;
  display:flex;
  flex-direction:column;
}

.header{
  padding:16px;
  border-bottom:1px solid rgba(255,31,31,.75);
  background:rgba(10,10,14,.97);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.room-title{
  font-weight:900;
  text-shadow:0 0 12px var(--red);
  letter-spacing:1px;
}

.room-sub{
  font-size:12px;
  color:var(--muted);
  margin-top:2px;
}

.pill{
  font-size:12px;
  border:1px solid rgba(255,31,31,.55);
  border-radius:999px;
  padding:7px 10px;
  background:rgba(255,31,31,.08);
}

#messages{
  flex:1;
  padding:16px;
  overflow-y:auto;
  background:rgba(0,0,0,.78);
}

.message{
  background:linear-gradient(180deg,#101018,#08080c);
  border-left:3px solid var(--red);
  padding:11px;
  border-radius:14px;
  margin-bottom:10px;
}

.name{
  font-weight:bold;
  color:var(--red2);
}

.time{
  float:right;
  font-size:12px;
  color:#aaa;
}

.system{
  text-align:center;
  color:#ccc;
  font-size:13px;
  margin:10px 0;
}

.sent-img,.sent-gif{
  max-width:260px;
  max-height:220px;
  border-radius:12px;
  margin-top:8px;
  border:1px solid var(--red);
  display:block;
}

.input-area{
  padding:12px;
  border-top:1px solid rgba(255,31,31,.75);
  background:#08080c;
}

.panel{
  display:none;
  max-height:165px;
  overflow-y:auto;
  padding:9px;
  border:1px solid rgba(255,31,31,.7);
  border-radius:12px;
  margin-bottom:8px;
  background:#050507;
}

.emoji{
  font-size:24px;
  cursor:pointer;
  margin:4px;
  display:inline-block;
}

.emoji:hover{
  transform:scale(1.25);
}

.gif-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(78px,1fr));
  gap:8px;
}

.gif-card{
  height:56px;
  border:1px solid rgba(255,31,31,.45);
  border-radius:12px;
  background:rgba(255,255,255,.06);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  cursor:pointer;
  position:relative;
}

.gif-card::after{
  content:"GIF";
  position:absolute;
  right:5px;
  bottom:4px;
  font-size:9px;
  background:#ff1f1f;
  padding:2px 4px;
  border-radius:5px;
}

.tools{
  display:flex;
  gap:8px;
  margin-bottom:8px;
}

.tools button{
  margin:0;
  width:auto;
  padding:9px 12px;
}

.row{
  display:flex;
  gap:8px;
}

.row input{
  margin:0;
  flex:1;
}

.row button{
  margin:0;
  width:120px;
}

#typingIndicator{
  height:18px;
  color:#ff7777;
  font-size:13px;
  margin:0 0 6px 4px;
}

.hidden{
  display:none;
}

.avatar{
  width:28px;
  height:28px;
  border-radius:50%;
  object-fit:cover;
  border:1px solid var(--red);
  vertical-align:middle;
  margin-right:7px;
}

.message-actions{
  margin-top:8px;
}

.delete-btn{
  width:auto;
  padding:5px 10px;
  font-size:12px;
  border-radius:8px;
  background:#8b0000;
  border:1px solid #ff1f1f;
  cursor:pointer;
}

.reactions{
  margin-top:8px;
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.reaction-btn{
  width:auto;
  margin:0;
  padding:5px 9px;
  font-size:13px;
  border-radius:999px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,31,31,.45);
}

/* FILM MERKEZI */
#filmHub{
  display:none;
  max-height:310px;
  overflow-y:auto;
  padding:14px;
  border-bottom:1px solid rgba(255,31,31,.75);
  background:linear-gradient(180deg,rgba(20,0,0,.96),rgba(5,5,8,.96));
}

.film-top{
  display:grid;
  grid-template-columns:1fr 190px;
  gap:10px;
  align-items:end;
}

.film-top input,.film-top select{
  margin:0;
}

.film-stats{
  font-size:12px;
  color:#ddd;
  margin:10px 0;
}

.film-list{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:10px;
}

.film-card{
  border:1px solid rgba(255,31,31,.45);
  border-radius:14px;
  background:rgba(255,255,255,.06);
  padding:10px;
  cursor:pointer;
  min-height:104px;
}

.film-card:hover{
  background:rgba(255,31,31,.18);
  box-shadow:0 0 15px rgba(255,31,31,.35);
  transform:translateY(-2px);
}

.film-card-title{
  font-weight:900;
  color:#fff;
  margin-bottom:7px;
}

.film-meta{
  font-size:12px;
  color:#ddd;
  line-height:1.5;
}

#filmModal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.76);
  z-index:20;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.film-modal-box{
  width:min(760px,94vw);
  background:#07070b;
  border:1px solid #ff1f1f;
  box-shadow:0 0 35px rgba(255,31,31,.65);
  border-radius:18px;
  padding:16px;
  display:grid;
  grid-template-columns:190px 1fr;
  gap:16px;
}

.film-poster{
  width:100%;
  border-radius:14px;
  border:1px solid rgba(255,31,31,.75);
}

.film-modal-box h2{
  text-align:left;
  margin:0 0 8px;
}

.film-modal-box p{
  color:#ddd;
  line-height:1.5;
}

.modal-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.modal-actions a,.modal-actions button{
  display:inline-block;
  width:auto;
  margin-top:10px;
  padding:10px 12px;
  border-radius:12px;
  border:1px solid #ff1f1f;
  background:linear-gradient(135deg,#ff1f1f,#8a0000);
  color:#fff;
  text-decoration:none;
  font-weight:bold;
}

@media(max-width:760px){
  .sidebar{
    width:100%;
    height:185px;
    float:none;
    border-right:none;
    border-bottom:1px solid var(--red);
  }

  .main{
    margin-left:0;
    height:calc(100% - 185px);
  }

  .row{
    flex-direction:column;
  }

  .row button{
    width:100%;
  }

  .film-top{
    grid-template-columns:1fr;
  }

  .film-modal-box{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="box" id="loginBox">
  <h2>DRIDEXCHAT</h2>
  <input id="code" placeholder="Davet kodu">
  <input id="username" placeholder="Kullanıcı adı">
  <input id="password" type="password" placeholder="Şifre">
  <input id="avatarInput" type="file" accept="image/*">
  <button id="loginBtn">Kanala Gir</button>
  <p id="error"></p>
</div>

<div id="chatBox">
  <div class="sidebar">
    <div class="brand">DRIDEXCHAT</div>

    <div class="section-title">Sohbet Odaları</div>
    <div id="rooms"></div>

    <div class="section-title">Çevrimiçi Kullanıcılar</div>
    <div id="users"></div>
  </div>

  <div class="main">
    <div class="header">
      <div>
        <div class="room-title" id="roomTitle"># genel</div>
        <div class="room-sub" id="roomDesc">Genel sohbet odası</div>
      </div>

      <div class="pill" id="onlineCount">0 çevrimiçi</div>
    </div>

    <div id="filmHub">
      <h2>🎬 Film Merkezi</h2>

      <div class="film-top">
        <input id="filmSearch" placeholder="Film ara...">
        <select id="filmCategory"></select>
      </div>

      <div class="film-stats" id="filmStats"></div>
      <div class="film-list" id="filmList"></div>
    </div>

    <div id="messages"></div>

    <div class="input-area">
      <div id="typingIndicator"></div>
      <div id="emojiPanel" class="panel"></div>
      <div id="gifPanel" class="panel">
        <div class="gif-grid" id="gifGrid"></div>
      </div>

      <div class="tools">
        <button id="emojiBtn">😀 Emoji</button>
        <button id="gifBtn">🎞️ GIF</button>
        <button id="imageBtn">🖼️ Resim</button>
        <button id="voiceBtn">🎤 Ses</button>
      </div>

      <div class="row">
        <input id="msg" placeholder="Mesaj yaz...">
        <button id="sendBtn">Gönder</button>
      </div>

      <input id="imageInput" class="hidden" type="file" accept="image/*">
    </div>
  </div>
</div>

<div id="filmModal">
  <div class="film-modal-box">
    <img id="modalPoster" class="film-poster" src="" alt="Film afişi">

    <div>
      <h2 id="modalTitle"></h2>
      <div class="film-meta" id="modalMeta"></div>
      <p id="modalDesc"></p>

      <div class="modal-actions">
        <a id="modalTrailer" href="#" target="_blank">🎥 Fragmanı İzle</a>
        <button id="modalClose">Kapat</button>
      </div>
    </div>
  </div>
</div>

<audio id="notifySound">
  <source src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg" type="audio/ogg">
</audio>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = typeof io !== "undefined" ? io() : {

};

const DAVET_KODU = "DRIDEX2026";

let currentUser = "";
let avatar = "";
let currentRoom = "genel";
let typingTimer = null;
let mediaRecorder = null;
let audioChunks = [];

const rooms = [
  ["genel","Genel sohbet odası"],
  ["oyun","Oyun muhabbeti"],

];

const filmTitles = [
  "Interstellar","Inception","The Matrix","Arrival","Dune","Blade Runner 2049","The Martian","Gravity","Tenet","Edge of Tomorrow",
  "Minority Report","Ex Machina","Her","Ready Player One","Avatar","Avatar: The Way of Water","Elysium","Oblivion","Looper","Source Code",
  "John Wick","John Wick 2","John Wick 3","John Wick 4","Mad Max: Fury Road","Gladiator","The Dark Knight","The Batman","The Equalizer","Extraction",
  "Mission Impossible","Mission Impossible Fallout","Top Gun Maverick","Skyfall","Casino Royale","The Bourne Identity","The Bourne Ultimatum","Taken","Heat","Die Hard",
  "The Conjuring","Insidious","Hereditary","The Nun","Annabelle","Sinister","It","It Chapter Two","A Quiet Place","A Quiet Place Part II",
  "The Ring","The Grudge","Get Out","Us","Nope","Midsommar","The Babadook","Smile","Talk to Me","The Exorcist",
  "The Shawshank Redemption","Forrest Gump","The Green Mile","Fight Club","Se7en","The Godfather","The Godfather Part II","Goodfellas","Scarface","The Pianist",
  "Whiplash","The Prestige","The Departed","Joker","Oppenheimer","The Social Network","A Beautiful Mind","Catch Me If You Can","The Wolf of Wall Street","12 Angry Men",
  "Superbad","The Hangover","The Hangover Part II","Home Alone","Home Alone 2","Rush Hour","Rush Hour 2","Jumanji","Jumanji: Welcome to the Jungle","The Mask",
  "Dumb and Dumber","21 Jump Street","22 Jump Street","Deadpool","Free Guy","The Intern","Yes Man","Bruce Almighty","Grown Ups","Central Intelligence",
  "Toy Story","Finding Nemo","WALL-E","Up","Inside Out","Coco","Soul","Ratatouille","Monsters, Inc.","Shrek",
  "How to Train Your Dragon","Kung Fu Panda","The Incredibles","Cars","Frozen","Moana","Zootopia","Spider-Man: Into the Spider-Verse","Spider-Man: Across the Spider-Verse","Puss in Boots: The Last Wish",
  "Spirited Away","Your Name","A Silent Voice","Princess Mononoke","Howl's Moving Castle","My Neighbor Totoro","Weathering with You","Suzume","Akira","Ghost in the Shell",
  "The Lord of the Rings: Fellowship of the Ring","The Lord of the Rings: The Two Towers","The Lord of the Rings: Return of the King","The Hobbit","Harry Potter and the Sorcerer's Stone","Harry Potter and the Chamber of Secrets","Harry Potter and the Prisoner of Azkaban","Harry Potter and the Goblet of Fire","Harry Potter and the Order of Phoenix","Harry Potter and the Deathly Hallows",

  "Iron Man","Captain America: The Winter Soldier","Black Panther","Thor Ragnarok","Spider-Man No Way Home","Logan","X-Men Days of Future Past","Man of Steel","Wonder Woman","Aquaman",
  "Hababam Sınıfı","Hababam Sınıfı Sınıfta Kaldı","Tosun Paşa","Süt Kardeşler","Kibar Feyzo","Çöpçüler Kralı","Davaro","Züğürt Ağa","Selvi Boylum Al Yazmalım","Eşkıya",
  "Vizontele","G.O.R.A.","A.R.O.G.","Yahşi Batı","Recep İvedik","Organize İşler","Kelebeğin Rüyası","Ayla","Mucize","Babam ve Oğlum",
  "Parasite","Oldboy","Train to Busan","Memories of Murder","The Handmaiden","Squid Game Movie Concept","Crouching Tiger Hidden Dragon","Hero","Ip Man","The Raid",
  "Rocky","Creed","Ford v Ferrari","Rush","Moneyball","The Blind Side","Coach Carter","Remember the Titans","The Fighter","Million Dollar Baby",
  "La La Land","The Greatest Showman","Bohemian Rhapsody","A Star Is Born","Elvis","Rocketman","8 Mile","Begin Again","Whiplash Extended","Amadeus",
  "Titanic","The Notebook","Pride and Prejudice","Me Before You","La Vita e Bella","Eternal Sunshine","About Time","The Fault in Our Stars","Before Sunrise","Notting Hill"
];

const categories = [
  "Bilim Kurgu","Aksiyon","Korku","Dram","Komedi",
  "Animasyon","Anime","Fantastik","Süper Kahraman","Türk Filmleri",
  "Asya Sineması","Spor","Müzikal","Romantik"
];

const descriptions = {
  "Bilim Kurgu":"Teknoloji, uzay, zaman ve insanlığın geleceği üzerine yüksek tempolu bir bilim kurgu filmi.",
  "Aksiyon":"Dövüş, kovalamaca, görev ve gerilim temposuyla öne çıkan aksiyon filmi.",
  "Korku":"Karanlık atmosfer, gerilim ve gizemli olaylarla ilerleyen korku filmi.",
  "Dram":"Karakterlerin iç dünyasına, çatışmalarına ve güçlü hikâyeye odaklanan dramatik film.",
  "Komedi":"Eğlenceli karakterleri ve hızlı mizah ritmiyle rahat izlenen komedi filmi.",
  "Animasyon":"Görsel dünyası, sıcak hikâyesi ve ailece izlenebilir yapısıyla öne çıkan animasyon filmi.",
  "Anime":"Japon animasyon dili, duygusal hikâye ve güçlü görsel atmosfer içeren anime filmi.",
  "Fantastik":"Büyülü evrenler, macera ve efsanevi karakterlerle ilerleyen fantastik film.",
  "Süper Kahraman":"Kahramanlık, güç, sorumluluk ve büyük mücadele temalarını işleyen film.",
  "Türk Filmleri":"Türk sinemasının komedi, dram ve kült sahneleriyle öne çıkan filmi.",
  "Asya Sineması":"Asya sinemasının güçlü atmosferi, aksiyonu ve hikâye anlatımıyla öne çıkan film.",
  "Spor":"Rekabet, disiplin, mücadele ve başarı hikâyesini anlatan spor filmi.",
  "Müzikal":"Müzik, sahne performansı ve karakter hikâyesini birleştiren film.",
  "Romantik":"Aşk, ilişki, zamanlama ve duygusal kararlar üzerine kurulu romantik film."
};

const films = filmTitles.map((title,index) => {
  const category = categories[Math.floor(index / 15)] || categories[index % categories.length];

  return {
    title:title,
    category:category,
    imdb:(7 + ((index * 7) % 23) / 10).toFixed(1),
    year:String(1990 + ((index * 7) % 34)),
    description:descriptions[category],
    poster:"https://dummyimage.com/300x450/08080c/ff1f1f.png&text=" + encodeURIComponent(title),
    trailer:"https://www.youtube.com/results?search_query=" + encodeURIComponent(title + " official trailer")
  };
});
const films = filmTitles.map((title,index) => {
const filmSearch = document.getElementById("filmSearch");
const filmCategory = document.getElementById("filmCategory");
const filmList = document.getElementById("filmList");
const filmStats = document.getElementById("filmStats");

categories.forEach(cat => {
  const opt = document.createElement("option");
  opt.value = cat;
  opt.textContent = cat;
  filmCategory.appendChild(opt);
});

filmCategory.insertAdjacentHTML(
  "afterbegin",
  `<option value="all">Tüm Kategoriler</option>`
);

filmCategory.value = "all";

function renderFilms(){

  const search = (filmSearch.value || "")
    .toLowerCase()
    .trim();

  const category = filmCategory.value;

  let filtered = films.filter(film => {

    const titleMatch =
      film.title.toLowerCase().includes(search);

    const categoryMatch =
      category === "all" ||
      film.category === category;

    return titleMatch && categoryMatch;
  });

  filmStats.innerHTML =
    `🎬 ${filtered.length} film bulundu`;

  filmList.innerHTML = "";

  filtered.forEach(film => {

    const card = document.createElement("div");

    card.className = "film-card";

    card.innerHTML = `
      <div class="film-card-title">
        ${film.title}
      </div>

      <div class="film-meta">
        ⭐ IMDb ${film.imdb}<br>
        📅 ${film.year}<br>
        🎭 ${film.category}
      </div>
    `;

    card.onclick = () => openFilm(film);

    filmList.appendChild(card);

  });

}

function openFilm(film){

  document.getElementById("filmModal").style.display =
    "flex";

  document.getElementById("modalPoster").src =
    film.poster;

  document.getElementById("modalTitle").innerText =
    film.title;

  document.getElementById("modalMeta").innerHTML =
    `
    ⭐ IMDb: ${film.imdb}
    <br>
    📅 Yıl: ${film.year}
    <br>
    🎭 Tür: ${film.category}
    `;

  document.getElementById("modalDesc").innerText =
    film.description;

  document.getElementById("modalTrailer").href =
    film.trailer;
}

document.getElementById("modalClose")
.addEventListener("click", () => {

  document.getElementById("filmModal")
  .style.display = "none";

});

filmSearch.addEventListener(
  "input",
  renderFilms
);

filmCategory.addEventListener(
  "change",
  renderFilms
);

renderFilms();
function changeRoom(room){

  if(room === currentRoom) return;

  currentRoom = room;

  messages.innerHTML = "";

  buildRooms();

  joinRoom(room);

  renderSystem(
    "Oda değiştirildi: #" + room
  );

  const filmHub =
    document.getElementById("filmHub");

  if(room === "film"){
