<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRIDEXCHAT</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#050505;
  --panel:#0b0b0f;
  --soft:#1a1a24;
  --red:#ff1f1f;
  --red2:#ff4d4d;
  --text:#fff;
  --muted:#aaa;
}

body{
  margin:0;
  height:100vh;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}
#matrix{
  position:fixed;
  top:0;
  left:0;
  z-index:0;
  pointer-events:none;
}

.box,#chatBox{
  z-index:2;
}
}

.box{
  width:430px;
  max-width:92vw;
  background:rgba(5,5,8,.94);
  border:1px solid var(--red);
  box-shadow:0 0 40px rgba(255,31,31,.75);
  padding:30px;
  border-radius:20px;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

h2,h3{
  text-align:center;
  text-shadow:0 0 12px var(--red);
}

input,button,select{
  width:100%;
  padding:13px;
  margin-top:12px;
  border-radius:12px;
  border:1px solid var(--red);
  background:#050505;
  color:#fff;
  font-size:15px;
  outline:none;
}

button{
  background:linear-gradient(135deg,#ff1f1f,#9b0000);
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#000;
  color:var(--red2);
  box-shadow:0 0 15px var(--red);
window.addEventListener("load", () => {

  buildRooms();
  buildEmojiPanel();
  buildGifPanel();
  renderFilms();

});
}

#error{
  color:#ff5555;
  text-align:center;
}

#chatBox{
  display:none;
  width:min(1160px,97vw);
  height:min(720px,95vh);
  background:rgba(0,0,0,.94);
  border:1px solid var(--red);
  box-shadow:0 0 45px rgba(255,31,31,.7);
  border-radius:20px;
  overflow:hidden;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

.sidebar{
  width:270px;
  height:100%;
  float:left;
  padding:14px;
  border-right:1px solid rgba(255,31,31,.8);
  background:linear-gradient(180deg,rgba(30,0,0,.98),rgba(8,8,14,.98));
  overflow-y:auto;
}

.brand{
  font-size:22px;
  font-weight:900;
  letter-spacing:2px;
  text-align:center;
  margin-bottom:16px;
  text-shadow:0 0 15px var(--red);
}

.section-title{
  font-size:12px;
  color:#bbb;
  text-transform:uppercase;
  letter-spacing:1.5px;
  margin:14px 0 8px;
}

.room,.user{
  padding:10px 12px;
  margin:7px 0;
  border:1px solid rgba(255,31,31,.45);
  border-radius:12px;
  background:rgba(255,31,31,.09);
  color:#fff;
  cursor:pointer;
}

.room:hover,.room.active{
  background:rgba(255,31,31,.25);
  box-shadow:0 0 14px rgba(255,31,31,.35);
  transform:translateX(3px);
}

.user{
  cursor:default;
  border-color:rgba(255,255,255,.12);
  background:rgba(255,255,255,.06);
}

.online-dot{
  color:#33ff77;
}

.main{
  margin-left:270px;
  height:100%;
  display:flex;
  flex-direction:column;
}

.header{
  padding:16px;
  border-bottom:1px solid rgba(255,31,31,.75);
  background:rgba(10,10,14,.97);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.room-title{
  font-weight:900;
  text-shadow:0 0 12px var(--red);
  letter-spacing:1px;
}

.room-sub{
  font-size:12px;
  color:var(--muted);
  margin-top:2px;
}

.pill{
  font-size:12px;
  border:1px solid rgba(255,31,31,.55);
  border-radius:999px;
  padding:7px 10px;
  background:rgba(255,31,31,.08);
}

#messages{
  flex:1;
  padding:16px;
  overflow-y:auto;
  background:rgba(0,0,0,.78);
}

.message{
  background:linear-gradient(180deg,#101018,#08080c);
  border-left:3px solid var(--red);
  padding:11px;
  border-radius:14px;
  margin-bottom:10px;
}

.name{
  font-weight:bold;
  color:var(--red2);
}

.time{
  float:right;
  font-size:12px;
  color:#aaa;
}

.system{
  text-align:center;
  color:#ccc;
  font-size:13px;
  margin:10px 0;
}

.sent-img,.sent-gif{
  max-width:260px;
  max-height:220px;
  border-radius:12px;
  margin-top:8px;
  border:1px solid var(--red);
  display:block;
}

.input-area{
  padding:12px;
  border-top:1px solid rgba(255,31,31,.75);
  background:#08080c;
}

.panel{
  display:none;
  max-height:165px;
  overflow-y:auto;
  padding:9px;
  border:1px solid rgba(255,31,31,.7);
  border-radius:12px;
  margin-bottom:8px;
  background:#050507;
}

.emoji{
  font-size:24px;
  cursor:pointer;
  margin:4px;
  display:inline-block;
}

.emoji:hover{
  transform:scale(1.25);
}

.gif-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(78px,1fr));
  gap:8px;
}

.gif-card{
  height:56px;
  border:1px solid rgba(255,31,31,.45);
  border-radius:12px;
  background:rgba(255,255,255,.06);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  cursor:pointer;
  position:relative;
}

.gif-card::after{
  content:"GIF";
  position:absolute;
  right:5px;
  bottom:4px;
  font-size:9px;
  background:#ff1f1f;
  padding:2px 4px;
  border-radius:5px;
}

.tools{
  display:flex;
  gap:8px;
  margin-bottom:8px;
}

.tools button{
  margin:0;
  width:auto;
  padding:9px 12px;
}

.row{
  display:flex;
  gap:8px;
}

.row input{
  margin:0;
  flex:1;
}

.row button{
  margin:0;
  width:120px;
}

#typingIndicator{
  height:18px;
  color:#ff7777;
  font-size:13px;
  margin:0 0 6px 4px;
}

.hidden{
  display:none;
}

.avatar{
  width:28px;
  height:28px;
  border-radius:50%;
  object-fit:cover;
  border:1px solid var(--red);
  vertical-align:middle;
  margin-right:7px;
}

.message-actions{
  margin-top:8px;
}

.delete-btn{
  width:auto;
  padding:5px 10px;
  font-size:12px;
  border-radius:8px;
  background:#8b0000;
  border:1px solid #ff1f1f;
  cursor:pointer;
}

.reactions{
  margin-top:8px;
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.reaction-btn{
  width:auto;
  margin:0;
  padding:5px 9px;
  font-size:13px;
  border-radius:999px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,31,31,.45);
}

/* FILM MERKEZI */
#filmHub{
  display:none;
  max-height:310px;
  overflow-y:auto;
  padding:14px;
  border-bottom:1px solid rgba(255,31,31,.75);
  background:linear-gradient(180deg,rgba(20,0,0,.96),rgba(5,5,8,.96));
}

.film-top{
  display:grid;
  grid-template-columns:1fr 190px;
  gap:10px;
  align-items:end;
}

.film-top input,.film-top select{
  margin:0;
}

.film-stats{
  font-size:12px;
  color:#ddd;
  margin:10px 0;
}

.film-list{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:10px;
}

.film-card{
  border:1px solid rgba(255,31,31,.45);
  border-radius:14px;
  background:rgba(255,255,255,.06);
  padding:10px;
  cursor:pointer;
  min-height:104px;
}

.film-card:hover{
  background:rgba(255,31,31,.18);
  box-shadow:0 0 15px rgba(255,31,31,.35);
  transform:translateY(-2px);
}

.film-card-title{
  font-weight:900;
  color:#fff;
  margin-bottom:7px;
}

.film-meta{
  font-size:12px;
  color:#ddd;
  line-height:1.5;
}

#filmModal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.76);
  z-index:20;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.film-modal-box{
  width:min(760px,94vw);
  background:#07070b;
  border:1px solid #ff1f1f;
  box-shadow:0 0 35px rgba(255,31,31,.65);
  border-radius:18px;
  padding:16px;
  display:grid;
  grid-template-columns:190px 1fr;
  gap:16px;
}

.film-poster{
  width:100%;
  border-radius:14px;
  border:1px solid rgba(255,31,31,.75);
}

.film-modal-box h2{
  text-align:left;
  margin:0 0 8px;
}

.film-modal-box p{
  color:#ddd;
  line-height:1.5;
}

.modal-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.modal-actions a,.modal-actions button{
  display:inline-block;
  width:auto;
  margin-top:10px;
  padding:10px 12px;
  border-radius:12px;
  border:1px solid #ff1f1f;
  background:linear-gradient(135deg,#ff1f1f,#8a0000);
  color:#fff;
  text-decoration:none;
  font-weight:bold;
}

@media(max-width:760px){
  .sidebar{
    width:100%;
    height:185px;
    float:none;
    border-right:none;
    border-bottom:1px solid var(--red);
  }

  .main{
    margin-left:0;
    height:calc(100% - 185px);
  }

  .row{
    flex-direction:column;
  }

  .row button{
    width:100%;
  }

  .film-top{
    grid-template-columns:1fr;
  }

  .film-modal-box{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="box" id="loginBox">
  <h2>DRIDEXCHAT</h2>
  <input id="code" placeholder="Davet kodu">
  <input id="username" placeholder="Kullanıcı adı">
  <input id="password" type="password" placeholder="Şifre">
  <input id="avatarInput" type="file" accept="image/*">
  <button id="loginBtn">Kanala Gir</button>
  <p id="error"></p>
</div>

<div id="chatBox">
  <div class="sidebar">
    <div class="brand">DRIDEXCHAT</div>

    <div class="section-title">Sohbet Odaları</div>
    <div id="rooms"></div>

    <div class="section-title">Çevrimiçi Kullanıcılar</div>
    <div id="users"></div>
  </div>

  <div class="main">
    <div class="header">
      <div>
        <div class="room-title" id="roomTitle"># genel</div>
        <div class="room-sub" id="roomDesc">Genel sohbet odası</div>
      </div>

      <div class="pill" id="onlineCount">0 çevrimiçi</div>
    </div>

    <div id="filmHub">
      <h2>🎬 Film Merkezi</h2>

      <div class="film-top">
        <input id="filmSearch" placeholder="Film ara...">
        <select id="filmCategory"></select>
      </div>

      <div class="film-stats" id="filmStats"></div>
      <div class="film-list" id="filmList"></div>
    </div>

    <div id="messages"></div>

    <div class="input-area">
      <div id="typingIndicator"></div>
      <div id="emojiPanel" class="panel"></div>
      <div id="gifPanel" class="panel">
        <div class="gif-grid" id="gifGrid"></div>
      </div>

      <div class="tools">
        <button id="emojiBtn">😀 Emoji</button>
        <button id="gifBtn">🎞️ GIF</button>
        <button id="imageBtn">🖼️ Resim</button>
        <button id="voiceBtn">🎤 Ses</button>
      </div>

      <div class="row">
        <input id="msg" placeholder="Mesaj yaz...">
        <button id="sendBtn">Gönder</button>
      </div>

      <input id="imageInput" class="hidden" type="file" accept="image/*">
    </div>
  </div>
</div>

<div id="filmModal">
  <div class="film-modal-box">
    <img id="modalPoster" class="film-poster" src="" alt="Film afişi">

    <div>
      <h2 id="modalTitle"></h2>
      <div class="film-meta" id="modalMeta"></div>
      <p id="modalDesc"></p>

      <div class="modal-actions">
        <a id="modalTrailer" href="#" target="_blank">🎥 Fragmanı İzle</a>
        <button id="modalClose">Kapat</button>
      </div>
    </div>
  </div>
</div>

<audio id="notifySound">
  <source src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg" type="audio/ogg">
</audio>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = typeof io !== "undefined" ? io() : {emit(){},on(){}};

const DAVET_KODU="DRIDEX2026";
let currentUser="";
let avatar="";
let currentRoom="genel";
let typingTimer=null;

const rooms=[
["genel","Genel sohbet odası"],
["oyun","Oyun muhabbeti"],
["teknoloji","Teknoloji ve yazılım"],
["müzik","Şarkı ve playlist"],
["ders","Ders çalışma"],
["film","Film/dizi ve öneriler"],
["memes","Meme ve eğlence"],
["yardım","Yardım ve destek"]
];

const loginBox=document.getElementById("loginBox");
const chatBox=document.getElementById("chatBox");
const error=document.getElementById("error");
const messages=document.getElementById("messages");
const msg=document.getElementById("msg");

document.getElementById("loginBtn").onclick=login;
document.getElementById("sendBtn").onclick=sendMessage;
document.getElementById("emojiBtn").onclick=()=>togglePanel("emojiPanel");
document.getElementById("gifBtn").onclick=()=>togglePanel("gifPanel");
document.getElementById("imageBtn").onclick=()=>document.getElementById("imageInput").click();

function login(){
  const code=document.getElementById("code").value.trim();
  const username=document.getElementById("username").value.trim();
  const password=document.getElementById("password").value.trim();

  if(code!==DAVET_KODU){error.innerText="Davet kodu hatalı!";return;}
  if(username.length<5){error.innerText="Kullanıcı adı en az 5 karakter olmalı!";return;}
  if(password.length<6){error.innerText="Şifre en az 6 karakter olmalı!";return;}

  currentUser=username;
  loginBox.style.display="none";
  chatBox.style.display="block";
  joinRoom(currentRoom);
}

function buildRooms(){
  const el=document.getElementById("rooms");
  el.innerHTML="";
  rooms.forEach(([id,desc])=>{
    const d=document.createElement("div");
    d.className="room"+(id===currentRoom?" active":"");
    d.innerText="# "+id;
    d.onclick=()=>changeRoom(id);
    el.appendChild(d);
  });
  updateRoomHeader();
}

function changeRoom(room){
  currentRoom=room;
  messages.innerHTML="";
  buildRooms();
  updateFilmHub();
  joinRoom(room);
  renderSystem("Oda değiştirildi: #"+room);
}

function updateRoomHeader(){
  const r=rooms.find(x=>x[0]===currentRoom)||rooms[0];
  document.getElementById("roomTitle").innerText="# "+r[0];
  document.getElementById("roomDesc").innerText=r[1];
}

function joinRoom(room){
  socket.emit("join",{username:currentUser,avatar,room});
}

function sendMessage(){
  const text=msg.value.trim();
  if(!text)return;
  socket.emit("message",{room:currentRoom,text});
  renderMessage({username:currentUser,text});
  msg.value="";
}

msg.addEventListener("keydown",e=>{
  if(e.key==="Enter")sendMessage();
});

function renderMessage(data){
  const div=document.createElement("div");
  div.className="message";
  div.innerHTML=`
    <span class="name">${escapeHtml(data.username||currentUser)}</span>
    <span class="time">${getTime()}</span><br>
    <span>${escapeHtml(data.text||"")}</span>
  `;
  messages.appendChild(div);
  messages.scrollTop=messages.scrollHeight;
}

function renderSystem(text){
  const div=document.createElement("div");
  div.className="system";
  div.innerText=text;
  messages.appendChild(div);
  messages.scrollTop=messages.scrollHeight;
}

function getTime(){
  return new Date().toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});
}

function escapeHtml(text){
  return String(text||"")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

function togglePanel(id){
  const el=document.getElementById(id);
  el.style.display=el.style.display==="block"?"none":"block";
}

function buildEmojiPanel(){
  const emojis="😀 😂 😎 🔥 💀 👑 ⚡ 🖤 🚀 ❤️ 👍".split(" ");
  const panel=document.getElementById("emojiPanel");
  panel.innerHTML="";
  emojis.forEach(e=>{
    const s=document.createElement("span");
    s.className="emoji";
    s.innerText=e;
    s.onclick=()=>{msg.value+=e;msg.focus();};
    panel.appendChild(s);
  });
}

function buildGifPanel(){
  const grid=document.getElementById("gifGrid");
  grid.innerHTML="";
  "😀 😂 😎 🔥 💀 👑 ⚡ 🚀".split(" ").forEach(e=>{
    const d=document.createElement("div");
    d.className="gif-card";
    d.innerText=e;
    grid.appendChild(d);
  });
}

/* FILMLER */
const filmTitles=[
"Interstellar","Inception","The Matrix","Dune","Arrival","The Dark Knight","Fight Club","Se7en","Gladiator","Joker",
"Oppenheimer","The Godfather","Forrest Gump","The Green Mile","Whiplash","The Prestige","Avatar","Titanic","John Wick","Mad Max Fury Road"
];

const films=[];
for(let i=0;i<200;i++){
  const base=filmTitles[i%filmTitles.length];
  films.push({
    title:base+" "+(i>=20?Math.floor(i/20)+1:""),
    imdb:(7+((i*7)%23)/10).toFixed(1),
    year:1990+((i*5)%35),
    category:["Bilim Kurgu","Aksiyon","Dram","Korku","Komedi","Türk Filmleri"][i%6],
    desc:"Bu film DRIDEX Film Merkezi için eklenmiş öneri filmidir.",
    trailer:"https://www.youtube.com/results?search_query="+encodeURIComponent(base+" official trailer")
  });
}

function updateFilmHub(){
  const hub=document.getElementById("filmHub");
  if(!hub)return;
  hub.style.display=currentRoom==="film"?"block":"none";
  if(currentRoom==="film")renderFilms();
}

function renderFilms(){
  const list=document.getElementById("filmList");
  const search=document.getElementById("filmSearch").value.toLowerCase();
  const stats=document.getElementById("filmStats");
  if(!list)return;

  const filtered=films.filter(f=>f.title.toLowerCase().includes(search));
  stats.innerText="🎬 "+filtered.length+" film bulundu";
  list.innerHTML="";

  filtered.forEach(f=>{
    const card=document.createElement("div");
    card.className="film-card";
    card.innerHTML=`
      <div class="film-card-title">🎬 ${f.title}</div>
      <div class="film-meta">⭐ IMDb ${f.imdb}<br>📅 ${f.year}<br>🎭 ${f.category}</div>
    `;
    card.onclick=()=>{
      document.getElementById("modalTitle").innerText=f.title;
      document.getElementById("modalMeta").innerHTML=`⭐ IMDb: ${f.imdb}<br>📅 Yıl: ${f.year}<br>🎭 Tür: ${f.category}`;
      document.getElementById("modalDesc").innerText=f.desc;
      document.getElementById("modalTrailer").href=f.trailer;
      document.getElementById("modalPoster").src="https://dummyimage.com/300x450/08080c/ff1f1f.png&text="+encodeURIComponent(f.title);
      document.getElementById("filmModal").style.display="flex";
    };
    list.appendChild(card);
  });
}

document.getElementById("filmSearch").addEventListener("input",renderFilms);
document.getElementById("modalClose").onclick=()=>{
  document.getElementById("filmModal").style.display="none";
};

/* MATRIX */
const canvas=document.getElementById("matrix");
const ctx=canvas.getContext("2d");

function resizeCanvas(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
}

resizeCanvas();

const letters="01DRIDEXCHAT#$%&@";
const fontSize=17;
let columns=Math.floor(canvas.width/fontSize);
let drops=Array(columns).fill(1);

function drawMatrix(){
  ctx.fillStyle="rgba(0,0,0,0.08)";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#ff1f1f";
  ctx.font=fontSize+"px monospace";

  for(let i=0;i<drops.length;i++){
    const text=letters[Math.floor(Math.random()*letters.length)];
    ctx.fillText(text,i*fontSize,drops[i]*fontSize);
    if(drops[i]*fontSize>canvas.height&&Math.random()>0.975)drops[i]=0;
    drops[i]++;
  }
}

setInterval(drawMatrix,35);

window.addEventListener("resize",()=>{
  resizeCanvas();
  columns=Math.floor(canvas.width/fontSize);
  drops=Array(columns).fill(1);
});

buildRooms();
buildEmojiPanel();
buildGifPanel();
renderFilms();
</script>
</body>
</html>
